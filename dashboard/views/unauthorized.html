<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Bot - Accesso Negato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-lang.js" defer></script>
</head>
<body>
  <%= userBarHtml %>

  <div class="container" style="text-align: center; padding: 40px 20px;">
    <div style="font-size: 3.5rem; margin-bottom: 15px;">🚫</div>
    <h1 data-i18n="unauthorizedTitle">Accesso Negato</h1>
    <p data-i18n="unauthorizedDesc" style="color: var(--text-muted); margin: 15px 0 25px 0; font-size: 1.05rem;">
      Non fai parte di nessun server Discord in cui il bot JARVIS è attualmente presente.
    </p>

    <a href="/auth/logout" class="btn" style="display: inline-block; max-width: 250px;" data-i18n="logout">Esci</a>
  </div>
</body>
</html>
