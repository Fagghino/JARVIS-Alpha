<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Bot - Classifica XP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-lang.js" defer></script>
  <style>
    .search-container {
      margin-bottom: 20px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px 12px 40px;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      color: var(--text-muted);
      gap: 12px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 140, 0, 0.1);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .no-results {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- User Profile Bar -->
  <%= userBarHtml %>

  <div class="container">
    <div class="title-bar">
      <a href="/select-guild" class="btn-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <div>
        <h1 style="margin-bottom: 0;"><%= guildName %></h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Leaderboard XP - <%= guildName %></p>
      </div>
    </div>

    <div class="search-container">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Cerca membro..." data-i18n="searchMember">
    </div>

    <div id="loading" class="loader">
      <div class="spinner"></div>
      <p>Caricamento dati dal database...</p>
    </div>

    <div id="leaderboardContent" style="display: none; overflow-x: auto;">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th data-i18n="rank">Pos</th>
            <th data-i18n="member">Membro</th>
            <th data-i18n="level">Livello</th>
            <th data-i18n="xpPoints">Punti XP</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <!-- Rows will be injected here -->
        </tbody>
      </table>
      <div id="noResults" class="no-results" style="display: none;">
        Nessun membro trovato corrisponde alla ricerca
      </div>
    </div>
  </div>

  <script>
    let usersData = [];
    const currentGuildId = "<%= guildId %>";

    document.addEventListener("DOMContentLoaded", async () => {
      const loadingEl = document.getElementById("loading");
      const contentEl = document.getElementById("leaderboardContent");
      const tbodyEl = document.getElementById("leaderboardBody");
      const searchInput = document.getElementById("searchInput");
      const noResultsEl = document.getElementById("noResults");

      try {
        const response = await fetch(`/api/leaderboard/${currentGuildId}`);
        if (!response.ok) {
          throw new Error("Errore durante il recupero dei dati");
        }
        
        usersData = await response.json();
        
        loadingEl.style.display = "none";
        contentEl.style.display = "block";
        
        renderLeaderboard(usersData);
        
        searchInput.addEventListener("input", (e) => {
          const query = e.target.value.toLowerCase().trim();
          const filtered = usersData.filter(user => 
            user.username.toLowerCase().includes(query) || 
            user.id.includes(query)
          );
          
          renderLeaderboard(filtered);
        });

      } catch (err) {
        console.error(err);
        loadingEl.innerHTML = `<p style="color: var(--offline)">❌ Impossibile caricare i dati della classifica.</p>`;
      }

      function renderLeaderboard(data) {
        tbodyEl.innerHTML = "";
        
        if (data.length === 0) {
          noResultsEl.style.display = "block";
          return;
        }
        
        noResultsEl.style.display = "none";
        
        data.forEach((user, index) => {
          const tr = document.createElement("tr");
          
          let rankClass = "";
          let rankDisplay = user.position;
          if (user.position === 1) {
            rankClass = "rank-1";
            rankDisplay = "🏆";
          } else if (user.position === 2) {
            rankClass = "rank-2";
            rankDisplay = "🥈";
          } else if (user.position === 3) {
            rankClass = "rank-3";
            rankDisplay = "🥉";
          }
          
          const avatarUrl = user.avatarUrl || "https://cdn.discordapp.com/embed/avatars/0.png";
          
          tr.innerHTML = `
            <td class="rank ${rankClass}">${rankDisplay}</td>
            <td>
              <div class="user-cell">
                <img src="${avatarUrl}" alt="${user.username}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                <span>${user.username}</span>
              </div>
            </td>
            <td><strong style="color: var(--primary);">${user.level}</strong></td>
            <td>${user.xp.toLocaleString()} XP</td>
          `;
          
          tbodyEl.appendChild(tr);
        });
      }
    });
  </script>
</body>
</html>
