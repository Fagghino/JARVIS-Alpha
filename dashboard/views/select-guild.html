<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Bot - Seleziona Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme-lang.js" defer></script>
  <style>
    .guilds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .guild-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .guild-card.active-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(255, 140, 0, 0.2);
    }
    .guild-card.disabled-card {
      opacity: 0.45;
      filter: grayscale(80%);
      pointer-events: none;
      user-select: none;
      position: relative;
    }
    .guild-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 15px;
      object-fit: cover;
      border: 2px solid var(--primary);
    }
    .guild-card.disabled-card .guild-icon {
      border-color: var(--text-muted);
    }
    .guild-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      word-break: break-word;
    }
    .guild-actions {
      margin-top: auto;
      width: 100%;
    }
    .guild-actions .btn {
      width: 100%;
      padding: 10px;
      font-size: 0.9rem;
    }
    .lock-badge {
      font-size: 0.8rem;
      color: var(--offline);
      background: rgba(255, 23, 68, 0.1);
      border: 1px solid rgba(255, 23, 68, 0.2);
      padding: 4px 10px;
      border-radius: 8px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <%= userBarHtml %>

  <div class="container">
    <div class="header">
      <h1 data-i18n="selectGuildTitle">Seleziona un Server</h1>
      <p data-i18n="selectGuildDesc" style="opacity: 0.8; margin-top: 5px;">Scegli un server Discord per accedere alle sue funzionalità.</p>
    </div>

    <div class="guilds-grid">
      <%= guildsGridHtml %>
    </div>

    <div class="footer-info" style="margin-top: 30px;">
      <a href="/" class="btn btn-secondary" style="max-width: 250px; margin: 0 auto;" data-i18n="backHome">🏠 Torna alla Home</a>
    </div>
  </div>
</body>
</html>
